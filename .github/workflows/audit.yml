# 라이브러리 취약점 점검 — 매달 1일 09:00(KST) · 잠금 파일이 바뀔 때 · Actions 탭에서 직접 실행
# 실패하면 알려진 취약점이 있는 라이브러리가 있다는 뜻입니다. 로그에서 패키지와 고칠 버전을 확인하세요.
name: Audit

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
  push:
    paths:
      - 'backend/Cargo.lock'
      - 'frontend/package-lock.json'
      - '.github/workflows/audit.yml'

jobs:
  cargo:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # 찾은 항목을 실행 화면의 주석(annotation)으로도 남김 (로그를 열지 않아도 보이게)
      - name: cargo audit
        shell: bash
        run: |
          set +e
          cargo audit --json > audit.json; code=$?
          v=$(jq -r '[.vulnerabilities.list[] | "\(.package.name) \(.package.version) — \(.advisory.id) \(.advisory.title) (고치는 버전: \(.versions.patched | join(", ")))"] | join("%0A")' audit.json)
          w=$(jq -r '[(.warnings // {}) | to_entries[] | .key as $k | .value[] | "\(.package.name) \(.package.version) — \($k) \(.advisory.id // "") \(.advisory.title // "")"] | join("%0A")' audit.json)
          [ -n "$v" ] && echo "::error title=cargo audit 취약점::$v"
          [ -n "$w" ] && echo "::warning title=cargo audit 경고::$w"
          cargo audit
          exit $code

  npm:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # 실제로 배포되는 라이브러리 (빌드 도구 제외) — 실패 기준
      # 빌드 도구까지 포함한 결과는 참고용 경고로만
      - name: npm audit
        shell: bash
        run: |
          set +e
          summary() { jq -r '[.vulnerabilities // {} | to_entries[] | "\(.key) [\(.value.severity)] \(.value.range) — 고침: \(if (.value.fixAvailable|type) == "object" then "\(.value.fixAvailable.name) \(.value.fixAvailable.version)" else (.value.fixAvailable|tostring) end)"] | join("%0A")'; }
          npm audit --omit=dev --json > prod.json; code=$?
          npm audit --json > all.json
          p=$(summary < prod.json); a=$(summary < all.json)
          [ -n "$p" ] && echo "::error title=npm audit (배포 라이브러리)::$p"
          [ -n "$a" ] && echo "::warning title=npm audit (빌드 도구 포함)::$a"
          npm audit --omit=dev
          exit $code
