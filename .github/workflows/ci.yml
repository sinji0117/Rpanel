name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rpanel_test
          MARIADB_USER: rpanel
          MARIADB_PASSWORD: rpanelpw
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # MongoDB 는 서비스 컨테이너 대신 직접 띄움 — 시작에 실패하면 컨테이너 로그를 annotation 으로 남김
      - name: MongoDB
        shell: bash
        run: |
          docker run -d --name mongo -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=root -e MONGO_INITDB_ROOT_PASSWORD=rootpw mongo:8.0
          for i in $(seq 60); do
            if docker exec mongo mongosh -u root -p rootpw --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then
              echo "MongoDB ready"; exit 0
            fi
            [ "$(docker inspect -f '{{.State.Running}}' mongo)" = true ] || break
            sleep 2
          done
          docker logs mongo 2>&1 | tail -30 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
          exit 1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        shell: bash
        # 실패하면 panic 메시지를 annotation 으로도 남김 (로그를 못 볼 때 원인 확인용)
        run: |
          set -o pipefail
          if ! cargo test 2>&1 | tee test.log; then
            grep -E -A6 "panicked at|^error" test.log | head -40 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
        env:
          RPANEL_TEST_DATABASE_URL: mysql://rpanel:rpanelpw@127.0.0.1:3306/rpanel_test
          RPANEL_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          RPANEL_TEST_MONGODB_URL: mongodb://root:rootpw@127.0.0.1:27017/?authSource=admin
          RPANEL_TEST_MONGO_USERS: "1"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
