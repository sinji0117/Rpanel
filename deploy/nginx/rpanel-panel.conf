# /etc/nginx/sites-available/rpanel-panel.conf — install.sh 가 __CERT__/__KEY__/__PORT__ 를 채워 설치합니다.
# Rpanel 관리 UI (HTTPS). 접속 허용 대역은 ufw 로 제한합니다 (install.sh --allow-from).
server {
    # Ubuntu 24.04 의 Nginx 1.24 는 'http2 on;' 지시어가 없어 listen 파라미터로 씁니다
    listen __PORT__ ssl http2;
    listen [::]:__PORT__ ssl http2;
    server_name _;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rpanel_panel:5m;
    # http:// 로 들어오면 같은 포트의 https 로
    error_page 497 =301 https://$host:$server_port$request_uri;

    root /usr/share/rpanel/www;
    index index.html;

    access_log /var/log/nginx/rpanel-panel-access.log;
    error_log  /var/log/nginx/rpanel-panel-error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    client_max_body_size 2m;

    # 파일 관리자 업로드 (최대 2GB, 버퍼링 없이 바로 전달)
    location ~ ^/api/apps/[0-9]+/files/upload$ {
        client_max_body_size 2048m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket (실시간 지표 / 배포 로그)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # (location 안에서 add_header 를 쓰면 위의 보안 헤더가 빠지므로 expires 로만 캐시 제어)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
