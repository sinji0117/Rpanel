# /etc/nginx/sites-available/rpanel-panel.conf
# Rpanel 관리 UI — Tailscale(100.64.0.0/10)·내부망(10.0.0.0/24) 전용 포트 9000
# (VM102의 :80 은 CT100이 들어오는 서비스용이므로 패널은 별도 포트로 분리합니다.
#  ufw로 9000 은 Tailscale/내부망에서만 허용 — install.sh 참고)
server {
    listen 9000;
    server_name _;

    root /usr/share/rpanel/www;
    index index.html;

    access_log /var/log/nginx/rpanel-panel-access.log;
    error_log  /var/log/nginx/rpanel-panel-error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (실시간 지표 / 배포 로그)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
