<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Rpanel</title>
    <!-- 첫 로딩 화면: 스크립트를 받는 동안(새로 고침 직후) 빈 화면 대신 보여 주고, 화면이 그려지면 사라짐 -->
    <script>
      try {
        var m = localStorage.getItem('rpanel.theme')
        if (m !== 'light' && m !== 'dark') m = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = m
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #0a0d12; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f4f6f9; }
      .rp-boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      .rp-boot-ring { position: absolute; width: 64px; height: 64px; box-sizing: border-box; border-radius: 50%;
        border: 3px solid #252d39; border-top-color: #34d399; animation: rp-boot-spin 0.8s linear infinite; }
      html[data-theme='light'] .rp-boot-ring { border-color: #d2d8e1; border-top-color: #059669; }
      @keyframes rp-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .rp-boot-ring { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="rp-boot" role="status" aria-label="Loading">
        <span class="rp-boot-ring"></span>
        <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#141922" stroke="#252d39" />
          <path d="M9 23V9h7.5a4.5 4.5 0 0 1 0 9H13l7 5" fill="none" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
